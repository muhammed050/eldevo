name: ElDevo v2 build

on:
  push:
    branches:
      - eldevo-v2-seo-tools

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Next.js
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eldevo-v2-build-log
          path: build.log
          retention-days: 7
      - name: Package source
        run: |
          rm -rf package/ .next out
          mkdir package
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='out' ./ package/
          cd package && zip -r ../eldevo-v2-ready.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: eldevo-v2-ready
          path: eldevo-v2-ready.zip
          retention-days: 14
