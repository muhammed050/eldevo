name: ElDevo production build

on:
  push:
    branches:
      - main
      - rebuild/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate core engines
        run: npm run validate-tools
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eldevo-build-log
          path: build.log
          retention-days: 7
