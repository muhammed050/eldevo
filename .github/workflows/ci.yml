name: ElDevo CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate tool registry
        run: npm run validate-tools
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Capture lint diagnostics
        if: always()
        run: npx eslint . --format json > lint-report.json || true
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldevo-lint-report
          path: lint-report.json
          if-no-files-found: error
      - name: Unit and tool tests
        run: npm test
      - name: Coverage
        run: npm run test:coverage
      - name: Capture tool test diagnostics
        if: always()
        run: npm test > test-report.txt 2>&1 || true
      - name: Upload tool test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldevo-test-report
          path: test-report.txt
          if-no-files-found: error
      - name: Production build
        run: npm run build
